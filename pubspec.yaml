name: amundsen_booking
description: "Booking- og produksjonsportal for artister og arrangører."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  intl: ^0.20.3
  pdf: ^3.13.1
  supabase_flutter: ^2.18.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo2.png
    - assets/brand/Bakgrunn3.jpeg
    - assets/artist/
  fonts:
    - family: Grooby
      fonts:
        - asset: public/fonts/grooby-demo.regular.ttf
