<!DOCTYPE html>
<html lang="nb">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Booking- og produksjonsportal for artister og arrangører.">
  <meta name="theme-color" content="#F3F0E8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lávdi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lávdi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    function lavdiUrlBase64ToBytes(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const output = new Uint8Array(raw.length);
      for (let index = 0; index < raw.length; index += 1) output[index] = raw.charCodeAt(index);
      return output;
    }

    function lavdiPushScope() {
      const base = document.querySelector('base')?.href || `${location.origin}/`;
      return {
        script: new URL('push/push-sw.js', base).href,
        scope: new URL('push/', base).href,
      };
    }

    window.lavdiPush = {
      supported: function () {
        return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      },
      subscribe: async function (publicKey) {
        try {
          if (!window.lavdiPush.supported()) return { error: 'unsupported' };
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') return { error: permission };
          const target = lavdiPushScope();
          const registration = await navigator.serviceWorker.register(target.script, {
            scope: target.scope,
          });
          const existing = await registration.pushManager.getSubscription();
          const subscription = existing || await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: lavdiUrlBase64ToBytes(publicKey),
          });
          const p256dh = subscription.getKey('p256dh');
          const auth = subscription.getKey('auth');
          if (!p256dh || !auth) return { error: 'missing-keys' };
          const encode = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer)))
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/, '');
          return {
            endpoint: subscription.endpoint,
            p256dh: encode(p256dh),
            auth: encode(auth),
          };
        } catch (error) {
          return { error: (error && error.message) || 'failed' };
        }
      },
      unsubscribe: async function () {
        const target = lavdiPushScope();
        const registration = await navigator.serviceWorker.getRegistration(target.scope);
        const subscription = await registration?.pushManager.getSubscription();
        const endpoint = subscription?.endpoint || '';
        if (subscription) await subscription.unsubscribe();
        return { endpoint };
      },
      show: async function (title, body, url) {
        const target = lavdiPushScope();
        const registration = await navigator.serviceWorker.register(target.script, {
          scope: target.scope,
        });
        await registration.showNotification(title, {
          body,
          data: { url },
          icon: new URL('icons/Icon-192.png', document.querySelector('base')?.href || `${location.origin}/`).href,
        });
      },
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
